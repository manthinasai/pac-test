---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pac-test-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"

    # 🔴 Versioned pipeline reference (triggers parsing bug)
    pipelinesascode.tekton.dev/pipeline: "foo://git-clone:0.9"

    # 🔴 Task from hub
    pipelinesascode.tekton.dev/task: foo"://git-clone:0.9"

spec:
  pipelineSpec:
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone     # <-- This references the hub task
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: https://github.com/tektoncd/pipeline
          - name: revision
            value: main
  workspaces:
    - name: source
      emptyDir: {}
