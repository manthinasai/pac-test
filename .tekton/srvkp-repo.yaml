apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: repro-test
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    # THIS TRIGGERS THE BUG
    pipelinesascode.tekton.dev/task: "test://git-clone:0.9"
spec:
  pipelineSpec:
    workspaces:
      - name: source
    tasks:
      - name: clone-task
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: "{{repo_url}}"
          - name: revision
            value: "{{revision}}"
  workspaces:
    - name: source
      emptyDir: {}
