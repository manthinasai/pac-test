apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: repro-srvkp-
  annotations:
    # Triggering events
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    
    # THE BUG TRIGGER: 
    # This tells PaC: "Go to the hub named 'test' and get version 0.9 of git-clone"
    # The Go URL parser in 1.20.2 sees 'test' as a host and ':0.9' as an invalid port.
    pipelinesascode.tekton.dev/task: "test://git-clone:0.9"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  pipelineSpec:
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        # This references the task fetched via the annotation above
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: "$(params.repo_url)"
          - name: revision
            value: "$(params.revision)"
  workspaces:
    - name: source
      emptyDir: {}
